{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h2>Tags</h2>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for tag in tags %}
        <tr>
          <td>{{ tag.name }}</td>
          <td>
            <a href="{% url 'todo:tags-update' tag.pk %}" class="btn btn-sm btn-warning">✏️ Update</a>
          </td>
          <td>
            <form method="post" action="{% url 'todo:tags-delete' tag.id %}" onsubmit="return confirm('Are you sure you want to delete this tag?');">
              {% csrf_token %}
              <button type="submit" class="btn btn-danger btn-sm">🗑️ Delete</button>
            </form>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="2">No tags available.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

  <a href="{% url 'todo:tags-create' %}" class="btn btn-primary">➕ Add New Tag</a>
</div>
{% endblock %}
