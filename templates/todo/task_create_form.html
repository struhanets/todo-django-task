{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
<div class="container mt-4">
  <h2>Create New Task</h2>

  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}

    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'todo:tasks' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
